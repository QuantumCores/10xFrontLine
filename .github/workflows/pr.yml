name: CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore API dependencies
        run: dotnet restore src/api/frontLineApi.slnx

      - name: Build API
        run: dotnet build src/api/frontLineApi.slnx --configuration Release --no-restore

      - name: Test API
        run: dotnet test src/api/frontLineApi.slnx --configuration Release --no-build

  angular:
    name: Angular build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mbl

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/mbl/package-lock.json

      - name: Install Angular dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Test Angular app
        run: npm test -- --no-progress
