<main class="play-page">
  <header>
    <div>
      <p class="eyebrow">Front Line</p>
      <h1>Match foundation</h1>
    </div>
    <button type="button" class="secondary" (click)="logout()">Sign out</button>
  </header>

  <section>
    <p class="account">{{ authState.player()?.email }}</p>
    <button type="button" (click)="submitSmokeResult()" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Save test result' }}
    </button>

    @if (saveStatus()) {
      <p class="status" role="status">{{ saveStatus() }}</p>
    }
  </section>
</main>
